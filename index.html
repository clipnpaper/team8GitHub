<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재밌는 사이트 모음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">우리 팀이 직접 고른</p>
    <h1>재밌는 사이트 모음</h1>
    <p class="hero-desc">심심할 때 하나씩 눌러보세요.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <!-- ▼▼▼▼▼ 카드 하나 시작 — 이 블록을 복사해서 쓰세요 ▼▼▼▼▼ -->
      <li class="card">
        <a class="card-link" href="https://film-grab.com/" target="_blank" rel="noopener">
          <span class="card-thumb" style="--thumb:#dfe6f0">🎞️</span>
          <span class="card-body">
            <strong class="card-title">Film-Grab</strong>
            <span class="card-summary">
              명작 영화들의 장면을 고화질 스크린샷으로 모아둔 아카이브, 구도와 색감 감상용으로 좋아요
            </span>
            <span class="card-meta">추천 · 세람</span>
          </span>
         </a>
        </li>
      <!-- ▲▲▲▲▲ 카드 하나 끝 ▲▲▲▲▲ -->

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 카드가 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

      <li class="card card-empty">
        <span>
          <span class="plus">＋</span>
          <strong>여기에 내 카드가 들어갑니다</strong>
          <em>위 블록을 복사해서 아래에 붙이세요</em>
        </span>
      </li>

    </ul>
  </main>

  <footer class="site-foot">
    깃 · 깃허브 특강 팀 프로젝트
  </footer>

</body>
</html>
