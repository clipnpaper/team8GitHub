<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세람 추천 · 보고 노는 사이트 두 곳</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="hero">
    <p class="hero-eyebrow">세람의 추천</p>
    <h1>보고 노는 사이트 두 곳</h1>
    <p class="hero-desc">눈으로 즐기는 사이트 두 개를 골라봤어요.</p>
  </header>

  <main class="container">
    <ul class="card-grid">

      <li class="card">
        <a class="card-link" href="https://film-grab.com/" target="_blank" rel="noopener">
          <span class="card-thumb" style="--thumb:#dfe6f0">🎞️</span>
          <span class="card-body">
            <strong class="card-title">Film-Grab</strong>
            <span class="card-summary">
              명작 영화들의 장면을 고화질 스크린샷으로 모아둔 아카이브, 구도와 색감 감상용으로 좋아요
            </span>
          </span>
        </a>
      </li>

      <li class="card">
        <a class="card-link" href="https://jacksonpollock.org/" target="_blank" rel="noopener">
          <span class="card-thumb" style="--thumb:#f5e6c8">🎨</span>
          <span class="card-body">
            <strong class="card-title">JacksonPollock.org</strong>
            <span class="card-summary">
              마우스로 클릭&드래그만 하면 잭슨 폴록풍 추상화가 완성되는 낙서 놀이터
            </span>
          </span>
        </a>
      </li>

    </ul>
  </main>

  <footer class="site-foot">
    <a href="../index.html">← 목록으로 돌아가기</a>
  </footer>

</body>
</html>
